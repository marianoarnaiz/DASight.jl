# ================================================================
#  DASight :: Artifacts.toml
#
#  Large files hosted outside git (on Zenodo). Julia downloads them the
#  first time they are needed and checks them against the checksums below.
#  Do NOT edit by hand: scripts/make_artifact.jl writes the entries.
#
#  Expected entries:
#     DASight_models        ZEUS.bson, POSEIDON.bson, HADES.bson (top level of the artifact)
#     DASight_example_data  data_test/ (.nc files) and Fake_DAS/ (1.jld2 ... 12.jld2)
#
#  Until the entries exist, models_dir() and example_data_dir() tell you so
#  and you can use your own copies (DASight_MODELS_DIR / DASight_DATA_DIR).
# ================================================================

[DASight_example_data]
git-tree-sha1 = "0ae135bcd1eb270b672516197b34925af4a85afd"
lazy = true

    [[DASight_example_data.download]]
    sha256 = "0b37214ffc79cd8a0bd1a50c38549b3944b28aae9cd8cc8ee2b5bc44ac502804"
    url = "https://zenodo.org/records/24109156/files/DASight_example_data.tar.gz?download=1"


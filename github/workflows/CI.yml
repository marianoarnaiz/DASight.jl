# Runs the test suite on every push and pull request.
# NOTE: first version, written without being able to run it: expect to tweak it
# after the first run (the Linux/xvfb step is the most likely thing to need it).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']        # LTS and latest release
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2

      # DASVader pulls in GLMakie, which wants a display even when only imported
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libxi6 libxrandr2 libxcursor1 libxinerama1

      # DASVader, Seis and Geodesics are not in Julia's General registry
      - name: Add unregistered dependencies
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.add([PackageSpec(url="https://github.com/anowacki/Geodesics.jl"),
                   PackageSpec(url="https://github.com/anowacki/Seis.jl"),
                   PackageSpec(url="https://github.com/marianoarnaiz/DASvader.jl")])

      - uses: julia-actions/julia-runtest@v1
        with:
          prefix: ${{ runner.os == 'Linux' && 'xvfb-run' || '' }}
